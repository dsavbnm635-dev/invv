<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>In Loving Memory · Iran Tavakoli</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Vazirmatn:wght@300;400;500;700&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1c1c;--soft:#5a5a5a;--line:#bdbdbd;--bg:#fefefe;--gray:#878787;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--gray);font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;color:var(--ink);overflow:hidden}
body.en{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.layer{position:fixed;inset:0;display:none}
.layer.on{display:block}
/* cover */
#cover{display:none;align-items:center;justify-content:center}
#cover.on{display:flex}
.stage{position:relative;width:min(100vw,calc(100dvh*.564));aspect-ratio:802/1422;background:url(assets/envelope.jpg) center/cover}
.pick{position:absolute;left:0;right:0;top:72%;text-align:center;color:#fff}
.langs{display:flex;justify-content:center;align-items:center;gap:18px}
.langs button{font-size:clamp(22px,6.4vw,32px);letter-spacing:.04em;padding:6px 10px;color:#fff;border-bottom:1px solid transparent;transition:.3s}
.langs button:hover,.langs button:focus-visible{border-color:#fff;outline:0}
.langs button.fa{font-family:"Vazirmatn",sans-serif;font-weight:300}
.langs button.en{font-family:"Cinzel","Cormorant Garamond",serif}
.langs i{width:1px;height:26px;background:rgba(255,255,255,.6)}
.hint{margin-top:16px;font:italic 400 clamp(15px,4.2vw,19px)/1.7 "Cormorant Garamond",serif;color:#eee;opacity:.9;animation:pulse 2.6s ease-in-out infinite}
.hint span{display:block;font:300 clamp(12px,3.4vw,15px) "Vazirmatn",sans-serif;font-style:normal}
@keyframes pulse{50%{opacity:.45}}
/* video */
#vid{background:#000}
#vid video{width:100%;height:100%;object-fit:contain;display:block}
#skip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;color:#fff;font-size:13px;letter-spacing:.1em;opacity:.7;padding:8px 14px;border:1px solid rgba(255,255,255,.4);border-radius:20px}
/* invitation */
#inv{background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{max-width:520px;margin:0 auto;padding:0 28px 0;text-align:center}
.fl{display:block;width:100%;mix-blend-mode:multiply}
.top{margin:0 -28px;width:calc(100% + 56px);max-width:none}
.bot{width:78%;margin:34px auto 0}
.tog{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-start:14px;z-index:5;font:500 12px "Cinzel",serif;letter-spacing:.12em;color:var(--soft);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:18px;padding:6px 12px}
.rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s ease}
.rv.in{opacity:1;transform:none}
.quote{margin-top:6px;font-size:clamp(17px,4.8vw,20px);line-height:2.1;font-weight:300;color:#2b2b2b}
body.en .quote{font-size:clamp(20px,5.4vw,23px);line-height:1.65;font-style:italic}
.by{margin-top:14px;font-size:15px;color:var(--soft);letter-spacing:.04em}
body.en .by{font-family:"Cinzel",serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:34px auto;color:var(--line)}
.orn:before,.orn:after{content:"";height:1px;width:70px;background:var(--line)}
.orn b{width:7px;height:7px;transform:rotate(45deg);border:1px solid #8a8a8a}
.lbl{font-size:15px;color:var(--soft);font-weight:300}
body.en .lbl{font:500 13px "Cinzel",serif;letter-spacing:.22em;text-transform:uppercase}
.ph{width:170px;aspect-ratio:304/464;margin:22px auto 0;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.ph:after{content:"";position:absolute;inset:-9px;border:1px solid var(--line);border-radius:50%}
.nm{margin-top:26px;font-size:clamp(34px,10vw,46px);font-weight:500;line-height:1.3;letter-spacing:.01em}
body.en .nm{font-size:clamp(40px,11.5vw,54px);font-weight:500;letter-spacing:.04em}
.msg{font-size:16px;line-height:2.1;color:#333;font-weight:300}
body.en .msg{font-size:20px;line-height:1.7}
.card{margin:6px auto 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 10px}
.card div{line-height:1.5}
.dt{font-size:clamp(21px,6vw,25px);font-weight:500}
.tm{margin:6px 0;font-size:20px;color:#333}
.vn{font-size:19px;color:#333;font-weight:500}
body.en .dt{font-size:clamp(26px,7vw,30px)} body.en .tm{font-size:24px} body.en .vn{font-size:23px;letter-spacing:.03em}
.btn{display:inline-block;margin-top:20px;padding:13px 28px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:15px;transition:.3s;border-radius:2px;background:transparent}
body.en .btn{font:500 13px "Cinzel",serif;letter-spacing:.18em;text-transform:uppercase}
.btn:hover{background:var(--ink);color:#fff}
.btn.solid{background:var(--ink);color:#fff;min-width:230px}
.btn.solid:hover{background:#000}
.close{margin-top:34px}
form{margin-top:10px}
input[type=text]{width:100%;padding:14px 4px;border:0;border-bottom:1px solid #8a8a8a;background:transparent;font:inherit;font-size:17px;text-align:center;color:var(--ink);outline:0;border-radius:0}
input[type=text]:focus{border-color:var(--ink)}
.cnt{display:flex;justify-content:center;gap:12px;margin-top:22px}
.cnt button{width:50px;height:50px;border:1px solid var(--line);border-radius:50%;font-size:19px;background:#fff;transition:.25s}
.cnt button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.cl{margin-top:22px;font-size:14px;color:var(--soft)}
body.en .cl{font-size:17px}
.note{margin-top:14px;font-size:13px;color:#a33;min-height:18px}
.ok{padding:22px;border:1px solid var(--line);margin-top:12px;line-height:2}
.ok a,.lnk{color:var(--soft);font-size:13px;text-decoration:underline;background:none;cursor:pointer}
.foot{padding:30px 0 40px}
/* admin */
#adm{background:rgba(255,255,255,.98);overflow:auto;z-index:9;direction:ltr;font-family:"Segoe UI",system-ui,sans-serif;text-align:left}
#adm .in{max-width:760px;margin:0 auto;padding:28px 20px}
.stats{display:flex;gap:14px;margin:18px 0}
.stats div{flex:1;padding:16px;border:1px solid var(--line);border-radius:6px}
.stats b{display:block;font-size:30px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;border-bottom:1px solid #e3e3e3;text-align:left}
.box{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.rv{transition:none}.hint{animation:none}}
</style>
</head>
<body>

<section id="cover" class="layer on">
  <div class="stage">
    <div class="pick">
      <div class="langs"><button class="fa" data-l="fa">فارسی</button><i></i><button class="en" data-l="en">English</button></div>
      <p class="hint">Click to open<span>برای باز کردن کلیک کنید</span></p>
    </div>
  </div>
</section>

<section id="vid" class="layer">
  <video id="v" playsinline preload="auto" src="assets/intro.mp4"></video>
  <button id="skip">SKIP ›</button>
</section>

<section id="inv" class="layer">
  <button class="tog" id="tog">EN</button>
  <div class="wrap">
    <img class="fl top" src="assets/floral-top.jpg" alt="">
    <div class="rv"><p class="quote" id="q"></p><p class="by" id="by"></p></div>
    <div class="orn rv"><b></b></div>
    <div class="rv"><p class="lbl" id="inm"></p>
      <div class="ph"><img src="assets/iran.webp" alt="Iran Tavakoli"></div>
      <h1 class="nm" id="nm"></h1></div>
    <div class="orn rv"><b></b></div>
    <p class="msg rv" id="msg"></p>
    <div class="card rv" style="margin-top:30px"><div class="dt" id="dt"></div><div class="tm" id="tm"></div><div class="vn" id="vn"></div>
      <a class="btn" id="map" target="_blank" rel="noopener noreferrer" href="https://maps.app.goo.gl/rnjVzsTE94nWzvav7"></a></div>
    <p class="msg close rv" id="cl"></p>
    <div class="orn rv"><b></b></div>
    <div class="rv" id="rs"></div>
    <img class="fl bot rv" src="assets/floral-bottom.jpg" alt="">
    <div class="foot"></div>
  </div>
</section>


<script>
const $=id=>document.getElementById(id);
const L={fa:{
q:"«مرگ را پیام‌آور شادی برای تو قرار دادم؛<br>پس چرا اندوهگینی؟<br>نور را آفریدم تا درخشش خود را بر تو بتاباند؛<br>پس چرا خود را از آن می‌پوشانی؟»",
by:"— حضرت بهاءالله",inm:"در یاد و خاطره‌ی مادر عزیزمان",nm:"ایران توکلی",
msg:"با عشقی عمیق و یاد و خاطره‌ای ماندگار،<br>از شما دعوت می‌کنیم در مراسم یادبود مادر عزیزمان در کنار ما حضور داشته باشید تا با هم زندگی و خاطره‌ی ایشان را گرامی بداریم.",
dt:"شنبه، ۱۷ اکتبر ۲۰۲۶",tm:"ساعت ۷:۳۰ شب",vn:"هتل رافلز – دبی",map:"مشاهده روی نقشه",
cl:"حضور شما و دعا و نیایش برای روح عزیز و گرانقدر ایشان،<br>مایه‌ی قدردانی و دلگرمی عمیق خانواده‌ی ما خواهد بود.",
name:"نام و نام خانوادگی",count:"تعداد افراد",go:"شرکت می‌کنم",need:"لطفاً نام خود را وارد کنید.",
thx:"سپاس از شما؛ حضورتان ثبت شد.",edit:"ویرایش",fail:"ثبت آنلاین در دسترس نیست. می‌توانید حضور خود را از طریق پیام اطلاع دهید.",wa:"ارسال پیام",tg:"EN",dg:["۱","۲","۳"]},
en:{
q:"I have made death a messenger of joy to thee. Wherefore dost thou grieve? I made the light to shed on thee its splendor. Why dost thou veil thyself therefrom?",
by:"Baháʼuʼlláh",inm:"In Loving Memory of Our Beloved Mother",nm:"Iran Tavakoli",
msg:"With profound love and remembrance, we invite you to join us for a Memorial Service in honor of our beloved mother, as we remember her life.",
dt:"Saturday, October 17, 2026",tm:"7:30 PM",vn:"Raffles Hotel – Dubai",map:"View on Map",
cl:"Your presence and prayers for her precious soul would be deeply appreciated by our family.",
name:"Full name",count:"Number of guests ",go:"I WILL ATTEND",need:"Please enter your name.",
thx:"Thank you. Your attendance has been recorded.",edit:"Edit",fail:"Online RSVP is unavailable right now. You can send your reply by message instead.",wa:"Send message",tg:"فا",dg:["1","2","3"]}};
const SHEET_URL="https://script.google.com/macros/s/AKfycbwb6bTUSr9ZP8ghymw7XLWhyIT-kYdlxSjzgWgom8wN4Exz3tj8yyFDCGaNFdpotRAp/exec";
let lang="fa",count=1,mine=null;
function setLang(l){lang=l;const t=L[l];document.documentElement.lang=l;document.documentElement.dir=l=="fa"?"rtl":"ltr";document.body.classList.toggle("en",l=="en");
 for(const k of["q","by","inm","nm","msg","dt","tm","vn","map","cl"])$(k).innerHTML=t[k];
 $("tog").textContent=t.tg;renderRsvp()}
function show(id){document.querySelectorAll(".layer").forEach(e=>e.classList.remove("on"));$(id).classList.add("on")}
function showInv(){const v=$("v");v.pause();show("inv");document.body.style.overflow="hidden";observe()}
function observe(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{root:$("inv"),threshold:.15});document.querySelectorAll(".rv").forEach(e=>io.observe(e))}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);show("vid");const v=$("v");v.currentTime=0;v.play().catch(showInv)});
$("v").onended=showInv;$("v").onerror=showInv;$("skip").onclick=showInv;
$("tog").onclick=()=>setLang(lang=="fa"?"en":"fa");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderRsvp(){const t=L[lang],r=$("rs");
 if(mine){r.innerHTML=`<div class="ok">${t.thx}<br><b>${esc(mine.name)}</b> · ${mine.count}<br><button class="lnk" id="ed">${t.edit}</button></div>`;$("ed").onclick=()=>{const m=mine;mine=null;renderRsvp();$("nmIn").value=m.name;count=m.count;paint()};return}
 r.innerHTML=`<form id="f" autocomplete="off"><input type="text" id="nmIn" maxlength="60" placeholder="${t.name}" aria-label="${t.name}"><p class="cl">${t.count}</p><div class="cnt">${[1,2,3].map(n=>`<button type="button" data-n="${n}">${t.dg[n-1]}</button>`).join("")}</div><p class="note" id="nt"></p><button class="btn solid" type="submit" id="go">${t.go}</button></form>`;
 r.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{count=+b.dataset.n;paint()});paint();
 $("f").onsubmit=submit}
function paint(){document.querySelectorAll("[data-n]").forEach(b=>b.classList.toggle("sel",+b.dataset.n==count))}
function rid(){try{let i=localStorage.getItem("rid");if(!i){i=crypto.randomUUID();localStorage.setItem("rid",i)}return i}catch(e){return crypto.randomUUID()}}
async function submit(e){e.preventDefault();const t=L[lang],name=$("nmIn").value.trim();
 if(!name){$("nt").textContent=t.need;return}
 const data={id:rid(),name,count:Math.min(3,Math.max(1,count)),lang};
 $("go").disabled=true;
 try{if(SHEET_URL.indexOf("https://")!==0)throw 0;await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});
  mine=data;try{localStorage.setItem("rsvp",JSON.stringify(data))}catch(x){}renderRsvp()}
 catch(x){$("go").disabled=false;const txt=encodeURIComponent((lang=="fa"?"شرکت می‌کنم – ":"I will attend – ")+name+" ("+data.count+")");
  $("nt").innerHTML=t.fail+`<br><a class="btn" style="margin-top:10px" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${txt}">${t.wa}</a>`}}
try{mine=JSON.parse(localStorage.getItem("rsvp")||"null")}catch(e){}
setLang("fa");
</script>
</body>
</html>
